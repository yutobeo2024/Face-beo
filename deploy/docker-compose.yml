# Face Beo trên VPS: app + Caddy (đường chính, đi thẳng) + cloudflared (đường dự phòng). Cổng 3100 chỉ mở trên loopback.
# Chạy từ /opt/facebeo/src:  docker compose -f deploy/docker-compose.yml -p facebeo up -d --build
# Dữ liệu: /opt/facebeo/data (DB, snapshots, backups, credentials, avatars) · mô hình: /opt/facebeo/models · cấu hình: /opt/facebeo/.env
# Sao lưu ngoài VPS: service backup → Cloudflare R2 (deploy/backup.sh, khôi phục: deploy/restore-offsite.sh)
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: facebeo-app:latest
    env_file: /opt/facebeo/.env
    environment:
      DATABASE_URL: "file:../data/facebeo.db"
      # v1.16.0: chạy sau Caddy trên chính máy này → IP thật nằm ở X-Forwarded-For do Caddy ghi (TRUSTED_PROXY_HOPS=1 mặc định).
      # Nếu quay lại chạy CHỈ qua Cloudflare Tunnel thì đặt lại CLIENT_IP_HEADER: "cf-connecting-ip".
      NODE_OPTIONS: "--max-old-space-size=1024"
    volumes:
      - /opt/facebeo/data:/app/data
      - /opt/facebeo/models:/app/models
    # Chỉ mở ra loopback của VPS cho Caddy gọi — không ra Internet (tường lửa vẫn chỉ mở 80/443).
    ports:
      - "127.0.0.1:3100:3000"
    mem_limit: 1500m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3000/login"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Sao lưu ra ngoài VPS: mỗi ngày 03:30 nén bản DB mới nhất + credentials/ + avatars/, mã hóa (rclone crypt), đẩy lên Cloudflare R2,
  # giữ 30 ngày. Dữ liệu chỉ đọc. Chạy tay: docker exec facebeo-backup-1 sh /scripts/backup.sh once
  backup:
    image: rclone/rclone:latest
    entrypoint: ["sh", "/scripts/backup.sh"]
    env_file: /opt/facebeo/.env
    environment:
      TZ: "ICT-7" # giờ Việt Nam (POSIX, không cần tzdata trong image)
    volumes:
      - /opt/facebeo/data:/data:ro
      - /opt/facebeo/backup-status:/status
      - ./backup.sh:/scripts/backup.sh:ro
    mem_limit: 256m
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "2m", max-file: "3" }

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Thiếu TUNNEL_TOKEN trong /opt/facebeo/.env}
    depends_on:
      - app
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
