# Chặn dò mật khẩu khi Face Beo chạy trực tiếp sau Caddy (v1.16.0).
# App đã có sẵn: khóa tài khoản khi sai nhiều lần + giới hạn 10 lượt đăng nhập/phút cho mỗi IP.
# fail2ban là lớp thứ hai: IP nào cứ gõ sai mãi thì chặn ở tường lửa, không tốn tài nguyên máy chủ nữa.
#
# Cài trên VPS:
#   apt-get install -y fail2ban
#   sed -n '/^\[Definition\]/,/^# ---- jail/p' /opt/facebeo/src/deploy/fail2ban-facebeo.conf > /etc/fail2ban/filter.d/facebeo-login.conf
#   sed -n '/^\[facebeo-login\]/,$p'          /opt/facebeo/src/deploy/fail2ban-facebeo.conf > /etc/fail2ban/jail.d/facebeo-login.conf
#   systemctl restart fail2ban && fail2ban-client status facebeo-login

[Definition]
# Log Caddy dạng JSON: {"request":{"remote_ip":"1.2.3.4",…,"uri":"/api/auth/login"},…,"status":401,…}
failregex = "remote_ip":"<HOST>".*"uri":"/api/auth/login".*"status":(401|429)
ignoreregex =
journalmatch =

# ---- jail ----------------------------------------------------------------------------------------------------

[facebeo-login]
enabled  = true
filter   = facebeo-login
port     = http,https
logpath  = /var/log/caddy/face.log
findtime = 600
maxretry = 10
bantime  = 3600
