# Face Beo — đường đi THẲNG tới VPS (v1.16.0), thay cho đường vòng qua Cloudflare ở Singapore.
# Đo thực tế từ máy ở Việt Nam: qua Cloudflare Tunnel ~300–420 ms/lượt; đi thẳng ~31 ms.
#
# Cài trên VPS:
#   cp /opt/facebeo/src/deploy/caddy-face.conf /etc/caddy/face.caddy
#   echo 'import /etc/caddy/face.caddy' >> /etc/caddy/Caddyfile     # thêm MỘT dòng, không sửa phần của dự án khác
#   sh /opt/facebeo/src/deploy/vn-ip-refresh.sh                      # tạo /etc/caddy/vn-ips.caddy
#   caddy validate --config /etc/caddy/Caddyfile && systemctl reload caddy
# DNS: face.ydsg.website → A 103.142.27.210, TẮT proxy (đám mây xám). Muốn quay lại đường hầm thì trả về bản ghi CNAME cũ.

face.ydsg.website {
	encode zstd gzip

	# Chỉ cho truy cập từ dải IP Việt Nam; trừ webhook Zalo (máy chủ Zalo gọi, đã kiểm chữ ký) và phần xác thực chứng chỉ.
	import /etc/caddy/vn-ips.caddy

	log {
		output file /var/log/caddy/face.log {
			roll_size 10mb
			roll_keep 5
		}
		format json
	}

	# App chạy trong Docker, chỉ mở cổng ra loopback của máy chủ (xem deploy/docker-compose.yml).
	reverse_proxy 127.0.0.1:3100 {
		header_up X-Forwarded-For {remote_host}
		header_up X-Real-IP {remote_host}
	}
}
